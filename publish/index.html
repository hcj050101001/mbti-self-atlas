.filter-tabs button {

  padding:7px 13px;
  border-radius:7px
}
.filter-tabs button.active {
  background:var(--card);
  box-shadow:0 2px 5px #223d2310
}
.review-count {
  font-size:11px;
  color:var(--muted)
}
.review-list {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}
.review-item {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  text-align:left;
  padding:14px 18px;
  display:flex;
  gap:14px;
  align-items:center;
  min-height:82px
}
.review-item:hover {
  border-color:#8caa88
}
.review-item-num {
  color:#7a8374;
  font-family:Georgia,serif;
  font-size:14px;
  flex-shrink:0;
  width:18px
}
.review-item-main {
  flex:1;
  min-width:0
}
.review-item-title {
  display:block;
  font-size:12px;
  line-height:1.6;
  word-break:break-word
}
.review-item-answer {
  display:block;
  font-size:11px;
  color:var(--green);
  margin-top:4px
}
.review-item.flagged .review-item-answer {
  color:var(--orange)
}
.review-sticky {
  position:sticky;
  bottom:0;
  background:#f5f3eef2;
  backdrop-filter:blur(12px);
  padding:18px 0 10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  border-top:1px solid var(--line);
  margin-top:25px
}
.review-sticky p {
  font-size:12px;
  color:var(--muted);
  margin:0
}
.empty-state {
  text-align:center;
  padding:40px;
  color:var(--muted);
  grid-column:1/-1
}
.result-intro {
  display:block;
  margin:10px 0 8px
}
.dimension-summary {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:6px 0 8px
}
.dimension-summary-card {
  min-width:0;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  padding:18px 18px 14px
}
.dimension-summary-card .dimension-title {
  flex-wrap:wrap;
  align-items:flex-start
}
.dimension-summary-card .score-tag {
  white-space:normal;
  text-align:right
}
.result-actions {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  margin-top:18px
}
.result-share-note {
  flex-basis:100%;
  margin:0;
  font-size:11px;
  line-height:1.7;
  color:var(--muted)
}
.result-type {
  display:flex;
  gap:9px;
  margin:18px 0 22px
}
.letter-tile {
  font-family:Georgia,serif;
  font-size:48px;
  width:73px;
  height:91px;
  border-radius:15px;
  display:grid;
  place-items:center;
  background:var(--green-soft);
  color:var(--green)
}
.letter-tile:nth-child(2) {
  background:var(--purple-soft);
  color:var(--purple)
}
.letter-tile:nth-child(3) {
  background:var(--orange-soft);
  color:var(--orange)
}
.letter-tile:nth-child(4) {
  background:var(--blue-soft);
  color:var(--blue)
}
.letter-tile.unclear {
  background:transparent;
  border:1px dashed #a9b0a1;
  color:#7c8474
}
.result-subtitle {
  font-size:22px;
  margin:0 0 12px
}
.result-lead {
  font-size:13px;
  color:var(--muted);
  line-height:1.9;
  margin-bottom:18px
}
.result-summary-box {
  border-top:1px solid var(--line);
  margin-top:16px;
  padding-top:18px
}
.result-summary-box h3 {
  font-size:16px
}
.result-summary-box p {
  font-size:12px;
  color:var(--muted);
  margin:12px 0
}
.result-facts {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px
}
.fact {
  background:#e9ece3;
  border-radius:6px;
  padding:5px 9px;
  font-size:10px;
  color:var(--muted)
}
.result-nav {
  display:flex;
  flex-wrap:wrap;
  gap:6px 22px;
  padding:14px 0;
  margin:0 0 30px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line)
}
.result-nav a {
  font-size:11px;
  color:var(--muted);
  text-decoration:none;
  border-bottom:1px solid transparent;
  padding:2px 0
}
.result-nav a:hover,.result-nav a:focus-visible {
  color:var(--green);
  border-bottom-color:currentColor;
  outline:none
}
.result-section {
  margin-top:14px;
  scroll-margin-top:16px
}
.result-fold {
  min-width:0;
  border-top:1px solid var(--line);
  padding-top:4px
}
.result-fold > summary {
  display:flex;
  align-items:flex-start;
  gap:12px;
  cursor:pointer;
  list-style:none;
  padding:12px 0
}
.result-fold > summary::-webkit-details-marker {
  display:none
}
.result-fold > summary::after {
  content:"展开";
  flex:none;
  font-size:11px;
  color:var(--muted);
  padding-top:2px
}
.result-fold[open] > summary::after {
  content:"收起"
}
.fold-heading {
  min-width:0;
  flex:1
}
.result-fold .section-kicker {
  margin-bottom:4px
}
.fold-title {
  display:block;
  font-size:16px;
  line-height:1.5
}
.fold-body {
  padding:0 0 12px;
  overflow-wrap:anywhere
}
.result-section h2 {
  font-size:22px;
  margin:0 0 12px
}
.section-intro {
  font-size:12.5px;
  color:var(--muted);
  line-height:1.9;
  max-width:64ch;
  margin:0 0 20px
}
.overview-copy p {
  font-size:13.5px;
  line-height:2;
  margin:0 0 12px;
  max-width:68ch
}
.overview-copy p:last-child {
  margin-bottom:0
}
.dimension-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px
}
.dimension-card {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  padding:24px
}
.dimension-title {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:17px
}
.dimension-title h3 {
  font-size:14px;
  margin:0;
  font-weight:500
}
.score-tag {
  font-size:11px;
  color:var(--muted);
  white-space:nowrap
}
.dimension-poles {
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px
}
.dimension-poles b {
  font-size:18px;
  margin-right:5px;
  font-family:Georgia,serif;
  font-weight:400
}
.track {
  height:9px;
  border-radius:10px;
  position:relative;
  margin:16px 5px 9px;
  background:linear-gradient(90deg,#dbe8d6,#ebeee6 50%,#ddd3ea)
}
.track:before {
  content:"";
  position:absolute;
  top:-4px;
  bottom:-4px;
  left:50%;
  width:1px;
  background:#a3aa9c
}
.track-marker {
  position:absolute;
  top:50%;
  width:17px;
  height:17px;
  background:var(--green);
  border:3px solid var(--card);
  box-shadow:0 0 0 1px var(--green);
  border-radius:50%;
  transform:translate(-50%,-50%)
}
.track-labels {
  display:flex;
  justify-content:space-between;
  font-size:9px;
  color:#899181;
  margin-bottom:18px
}
.dimension-meaning {
  font-size:12px;
  margin:0;
  color:var(--muted);
  line-height:1.85
}
.boundary-tag {
  display:inline-block;
  color:#956342;
  font-size:10px;
  padding:2px 6px;
  background:#f5e8da;
  border-radius:5px;
  margin-right:6px
}
.score-explainer {
  font-size:11px;
  color:var(--muted);
  margin:15px 0 30px
}
.dimension-strength {
  display:flex;
  align-items:flex-start;
  gap:7px;
  margin:0 0 14px;
  font-size:10px;
  color:var(--muted);
  line-height:1.7
}
.dimension-strength .strength-tag {
  flex:none;
  margin-right:0
}
.reading-block + .reading-block {
  margin-top:10px
}
.reading-label {
  font-size:9px;
  letter-spacing:.08em;
  color:var(--green);
  margin-bottom:4px
}
.reading-text {
  font-size:12px;
  margin:0;
  color:var(--muted);
  line-height:1.9
}
.strength-tag {
  display:inline-block;
  font-size:10px;
  padding:2px 7px;
  border-radius:5px;
  margin-right:7px;
  color:#4d6249;
  background:#e3ebdc
}
.strength-tag.balanced {
  color:#8a613f;
  background:#f5e8da
}
.strength-tag.strong {
  color:#4a3f66;
  background:#e6e0f0
}
.score-line {
  font-size:10px;
  color:#899181;
  margin:0
}
.interpretation-block {
  margin-top:40px
}
.interpretation-block h2 {
  font-size:22px;
  margin:0 0 18px
}
.interaction-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px
}
.interaction-card {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  padding:22px 24px
}
.interaction-card h3 {
  font-size:14px;
  font-weight:500;
  margin:0 0 10px
}
.interaction-card p {
  font-size:12px;
  color:var(--muted);
  line-height:1.85;
  margin:0
}
.interaction-keys {
  font-size:9px;
  letter-spacing:.08em;
  color:var(--green);
  margin-bottom:6px
}
.interaction-grid .interaction-card:last-child:nth-child(odd) {
  grid-column:1/-1
}
.interaction-empty {
  font-size:12px;
  color:var(--muted);
  line-height:1.9;
  margin:0
}
.scene-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px
}
.scene-card {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  padding:22px 24px
}
.scene-card h3 {
  font-size:14px;
  font-weight:500;
  margin:0 0 14px
}
.scene-item + .scene-item {
  border-top:1px solid var(--line);
  margin-top:14px;
  padding-top:14px
}
.scene-label {
  font-size:9px;
  letter-spacing:.06em;
  color:var(--green);
  margin-bottom:5px
}
.scene-item p {
  font-size:12px;
  color:var(--muted);
  line-height:1.85;
  margin:0
}
.caveat-panel {
  background:#f1f0e9;
  border:1px solid var(--line);
  border-radius:17px;
  padding:24px 26px
}
.caveat-panel h2 {
  font-size:18px;
  margin-bottom:12px
}
.caveat-panel ul {
  margin:0;
  padding-left:18px
}
.caveat-panel li {
  font-size:11px;
  color:var(--muted);
  line-height:1.85;
  margin-bottom:7px
}
.caveat-panel li:last-child {
  margin-bottom:0
}
.result-bottom {
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:30px
}
.result-bottom .button {
  font-size:12px;
  min-height:41px
}
.modal {
  border:1px solid var(--line);
  border-radius:22px;
  background:var(--card);
  color:var(--ink);
  padding:25px 32px 32px;
  width:min(720px,calc(100% - 28px));
  max-height:85dvh;
  box-shadow:0 30px 100px #16251835
}
.modal::backdrop {
  background:#1b2e255c;
  backdrop-filter:blur(5px)
}
.modal-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  position:sticky;
  top:-25px;
  background:var(--card);
  padding-top:3px;
  z-index:1
}
.icon-button {
  font-size:26px;
  line-height:1;
  width:36px;
  height:36px;
  border-radius:50%;
  color:var(--muted)
}
.icon-button:hover {
  background:var(--green-soft)
}
.modal h2 {
  font-size:25px;
  margin-bottom:20px
}
.modal h3 {
  font-size:15px;
  margin:23px 0 10px
}
.modal p,.modal li {
  font-size:13px;
  color:var(--muted);
  line-height:1.9
}
.modal ul {
  padding-left:22px
}
.modal .button {
  font-size:13px
}
.modal code {
  font-family:Consolas,monospace;
  font-size:11px;
  overflow-wrap:anywhere
}
.formula {
  background:#edf0e8;
  padding:12px;
  border-radius:8px;
  line-height:2
}
.source-list {
  padding:0;
  list-style:none
}
.source-list li {
  padding:10px 0;
  border-bottom:1px solid var(--line)
}
.source-list small {
  display:block
}
.source-table-wrap {
  overflow-x:auto
}
.source-table {
  border-collapse:collapse;
  width:100%;
  font-size:11px;
  margin:15px 0
}
.source-table td,.source-table th {
  padding:9px 7px;
  text-align:left;
  border-bottom:1px solid var(--line);
  vertical-align:top;
  min-width:45px
}
.source-table th {
  font-weight:600;
  color:var(--green)
}
.source-table .en {
  display:block;
  color:var(--muted)
}
details {
  margin-top:16px
}
summary {
  cursor:pointer;
  font-size:13px;
  color:var(--green)
}
.toast {
  position:fixed;
  bottom:26px;
  left:50%;
  transform:translate(-50%,12px);
  padding:11px 20px;
  background:#243f33;
  color:white;
  border-radius:12px;
  box-shadow:0 6px 30px #19342525;
  max-width:calc(100% - 30px);
  width:max-content;
  text-align:center;
  font-size:12px;
  opacity:0;
  transition:all .2s;
  pointer-events:none;
  z-index:20
}
.toast.visible {
  opacity:1;
  transform:translate(-50%,0)
}
.noscript {
  padding:30px;
  text-align:center
}
.notice-inline {
  font-size:12px;
  padding:12px 15px;
  background:var(--orange-soft);
  border-radius:9px;
  color:#714d37;
  margin:15px 0
}
.confirm-actions {
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:25px
}

@media(min-width:1400px) {
  .site-shell {
    max-width:1280px
  }
  .hero {
    padding-top:75px;
    padding-bottom:55px
  }
  .hero h1 {
    font-size:56px
  }
}

    padding:0 28px
  }

  }
  .intro-grid {
    gap:26px
  }
  .stat {
    padding-left:20px;
    gap:10px

    gap:10px
  }
  .interaction-grid,.scene-grid {
    grid-template-columns:1fr
  }
}

        side: side,

        strength: strength,
        strengthLabel: STRENGTHS[strength].label,
        strengthNote: STRENGTHS[strength].text,
        expression: copy.expression,
        upside: copy.upside,
        watch: copy.watch,
        scoreLine: scoreLine(dimension)
      };
      dimensionsByKey[dimension.key] = item;
      return item;
    });
    var balancedCount = dimensions.filter(function (dimension) { return dimension.side === "balanced"; }).length;
    var candidateCount = Math.pow(2, balancedCount);
    var interactions = buildInteractions(dimensionsByKey, sourceDistance);
    var headline = balancedCount === 0
      ? "你的回答整体偏向 " + scoreResult.cautiousType
      : "你的回答目前呈现为 " + scoreResult.cautiousType;
    return freezeDeep({
      headline: headline,
      summary: buildSummary(scoreResult, dimensions, balancedCount, candidateCount),
      overall: buildOverall(scoreResult, dimensions, balancedCount),
      dimensions: dimensions,
      interactions: interactions,
      scenes: buildScenes(dimensionsByKey),
      caveats: CAVEATS,
      candidateCount: candidateCount
    });
  }

  return Object.freeze({
    DIMENSIONS: DIMENSIONS,
    STRENGTHS: STRENGTHS,
    INTERACTION_PAIRS: INTERACTION_PAIRS,
    SCENE_GROUPS: SCENE_GROUPS,
    interpret: interpret
  });
});

  function setRemember(value) {

        const current = localStorage.getItem(STORAGE_KEY);

        if (current !== null && !storageSession) { incompatibleDraft(); return; }
        if (!storageSession) storageSession = newSessionId();
        state.remember = true;
        if (save()) notice('已开启此设备的进度保存。');
        else if (persistenceInvalidated) return;
        else throw new Error('Storage unavailable');
      } catch (_) {
        state.remember = false;
        storageWorking = false;
        notice('无法开启保存：浏览器拒绝了存储。进度仅保留在当前页面。');
      }
    }
    else {
      try {
        if (localStorage.getItem(STORAGE_KEY) !== storageSnapshot) { invalidatePersistence(); return; }

        }
      }
      if (await writeClipboard(text)) notice('此环境无法系统分享，摘要已复制到剪贴板。');
    },
    downloadReport,
    printReport() {
      if (!Core.validateAnswers(state.answers, true)) return;
      const report = reportData();
      const oldReport = main.querySelector('.print-report');
      if (oldReport) oldReport.outerHTML = reportMarkup(report);
      const previousTitle = document.title;
      document.title = window.MBTIReport.filename(report).replace(/\.png$/, '');
      try { window.print(); } finally { document.title = previousTitle; }
    },
    reset: confirmReset,
    cancelReset() { dialog.close(); },
    confirmReset() {
      try {
        const current = localStorage.getItem(STORAGE_KEY);
        if (current !== null && current !== storageSnapshot) { invalidatePersistence(); return; }
        localStorage.removeItem(STORAGE_KEY);
        if (localStorage.getItem(STORAGE_KEY) !== null) throw new Error('Draft was not removed');
      }
      catch (_) { storageError('浏览器未允许清除本地草稿，因此没有开始新的回答。请先清除此页面的站点数据，再换人使用，避免刷新后恢复上一位的回答。'); return; }
      storageSnapshot = null; storageSession = null; storageRevision = 0; persistenceInvalidated = false;
      persistenceNotice.hidden = true; persistenceNotice.textContent = '';
      cancelNext(); state = freshState(); activeStart = null; recovered = false; returnToReview = false; filter = 'all'; dialog.close(); dialogContent.innerHTML = ''; setView('welcome');
    }
  };
  const ACTION_WITH_CANCEL = new Set(['prev', 'next', 'english', 'flag', 'review']);
  document.addEventListener('click', event => {
    const foldLink = event.target.closest && event.target.closest('a[href^="#result-"]');
    if (foldLink && typeof foldLink.getAttribute === 'function') {
      const fold = document.getElementById(foldLink.getAttribute('href').slice(1));
      if (fold && fold.tagName === 'DETAILS') fold.open = true;
    }
    const button = event.target.closest('button');
    if (!button || button.disabled) return;
    if (button.dataset.dialog) { openDialog(button.dataset.dialog); return; }
    if (button.dataset.question !== undefined) { if (dialog.open) dialog.close(); openQuestion(Number(button.dataset.question), button.dataset.fromReview === 'true'); return; }
    if (button.dataset.filter) { filter = button.dataset.filter; renderKeepingFocus(`[data-filter="${filter}"]`); return; }
    const action = button.dataset.action;
    if (!action) return;
    if (ACTION_WITH_CANCEL.has(action)) cancelNext();
    const handler = actionHandlers[action];
    if (handler) handler();
  });
  document.addEventListener('pointerdown', event => { pointerChoice = !!event.target.closest('.choice'); });
  document.addEventListener('change', event => {
    const target = event.target;
    if (target.name === 'answer') { updateSelection(Number(target.value), pointerChoice); pointerChoice = false; }
    else if (target.id === 'autoNext') { cancelNext(); patchState({ autoNext: target.checked }); }
    else if (target.id === 'remember' || target.id === 'rememberDialog') setRemember(target.checked);
  });
  document.addEventListener('keydown', event => {
    pointerChoice = false;
    if (state.view !== 'question' || dialog.open || event.ctrlKey || event.metaKey || event.altKey || event.repeat) return;
    const target = event.target;
    if (target.tagName === 'TEXTAREA' || target.tagName === 'SELECT' || (target.tagName === 'INPUT' && target.type !== 'radio')) return;
    if (target.tagName === 'INPUT' && target.type === 'radio' && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(event.key)) return;
    if (/^[1-5]$/.test(event.key)) { event.preventDefault(); updateSelection(Number(event.key), true); }
    else if (event.key === 'Enter' && target.tagName !== 'BUTTON') { event.preventDefault(); nextQuestion(); }
    else if (event.key === 'ArrowRight' && target.tagName !== 'BUTTON') { event.preventDefault(); nextQuestion(); }
    else if (event.key === 'ArrowLeft' && target.tagName !== 'INPUT' && state.index > 0) { event.preventDefault(); openQuestion(state.index - 1, returnToReview); }
  });
  document.getElementById('homeButton').addEventListener('click', () => setView('welcome'));
  document.getElementById('closeDialog').addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', event => { if (event.target === dialog) { const rect = dialog.getBoundingClientRect(); if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close(); } });
  document.addEventListener('visibilitychange', () => { cancelNext(); checkpoint(); save(); });
  window.addEventListener('pagehide', () => { cancelNext(); save(); });
  window.addEventListener('storage', event => {
    if (!state.remember || (event.key !== STORAGE_KEY && event.key !== null)) return;
    try { if (localStorage.getItem(STORAGE_KEY) !== storageSnapshot) invalidatePersistence(true); }
    catch (_) { storageWorking = false; updateSaveStatus(); notice('无法核对本地草稿；当前页面暂时不能保存进度。'); }
  });
  window.addEventListener('beforeunload', event => { if (count() > 0 && (!state.remember || !storageWorking) && !state.completedAt) { event.preventDefault(); event.returnValue = ''; } });
  window.addEventListener('beforeprint', () => {
    document.querySelectorAll('details.result-fold').forEach(fold => {
      fold.dataset.printOpen = fold.open ? 'true' : 'false';
      fold.open = true;
    });
  });
  window.addEventListener('afterprint', () => {
    document.querySelectorAll('details.result-fold').forEach(fold => {
      if (fold.dataset.printOpen !== 'true') fold.open = false;
    });
  });
  load(); render();
})();

</script>
</body>
</html>
