<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f3ee">
  <meta name="description" content="见己：可离线使用的 OEJTS 1.2 中文试译探索工具，32道完整题目、透明计分与本地规则解读。非官方 MBTI 测评。">
  <title>见己 · MBTI 四维探索</title>
  <style>
@charset "UTF-8";

:root {
  --paper:#f5f3ee;
  --card:#fffefa;
  --ink:#242c29;
  --muted:#66706a;
  --line:#dcdfd7;
  --green:#234f43;
  --green-soft:#e7eee6;
  --purple:#776aab;
  --purple-soft:#e9e4f3;
  --orange:#b6673e;
  --orange-soft:#f3e2d4;
  --blue:#527a8e;
  --blue-soft:#dfeaf0;
  --shadow:0 16px 50px #293d2e08;
  --radius:24px;
  font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:var(--paper);
  font-synthesis:none
}

* {
  box-sizing:border-box
}
body {
  margin:0;
  font-size:15px;
  line-height:1.7
}
button,input,textarea {
  font:inherit
}
button,a,input,textarea {
  -webkit-tap-highlight-color:transparent
}
button {
  cursor:pointer;
  color:inherit
}
button:disabled {
  cursor:not-allowed;
  opacity:.4
}
a {
  color:var(--green);
  text-underline-offset:4px
}
button {
  border:0;
  background:none
}
button:focus-visible,a:focus-visible,summary:focus-visible,textarea:focus-visible,input:focus-visible {
  outline:3px solid #7965ad;
  outline-offset:4px
}
button,a {
  touch-action:manipulation
}
::selection {
  background:#d8e6d4
}
h1,h2,h3,p {
  margin-top:0
}
h1,h2,h3 {
  line-height:1.3
}
h2 {
  font-size:28px;
  letter-spacing:-.7px
}
h3 {
  font-size:17px
}
small {
  font-size:12px
}
.site-shell {
  max-width:1240px;
  margin:auto;
  padding:0 48px
}
.site-header {
  height:100px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line)
}
.brand {
  display:flex;
  gap:12px;
  align-items:center;
  padding:0;
  text-align:left;
  font-size:23px;
  font-weight:650;
  line-height:1.2;
  letter-spacing:2px
}
.brand-en {
  display:block;
  font-size:9px;
  letter-spacing:2.4px;
  font-weight:500;
  margin-top:6px
}
.brand-mark {
  display:grid;
  grid-template-columns:repeat(2,12px);
  gap:3px;
  transform:rotate(-8deg)
}
.brand-mark i {
  width:12px;
  height:12px;
  border-radius:3px;
  background:var(--green)
}
.brand-mark i:nth-child(2) {
  background:#b5a9d2
}
.brand-mark i:nth-child(3) {
  background:#dda57b
}
.brand-mark i:nth-child(4) {
  background:#8ba6b2
}
.site-header nav {
  display:flex;
  gap:28px
}
.text-button {
  font-size:13px;
  padding:8px 0;
  color:var(--muted)
}
.text-button:hover {
  color:var(--green)
}
.site-footer {
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:24px 0 30px;
  font-size:11px;
  color:var(--muted);
  margin-top:56px
}
.footer-dot {
  padding:0 8px
}
.eyebrow {
  font-size:11px;
  font-weight:650;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--green)
}
.muted {
  color:var(--muted)
}
.skip-link {
  position:fixed;
  left:20px;
  top:-100px;
  background:var(--card);
  padding:10px;
  z-index:100
}
.skip-link:focus {
  top:10px
}
#main:focus {
  outline:0
}
.view {
  animation:arrive .34s ease both
}
@keyframes arrive {
  from {
    opacity:0;
    transform:translateY(9px)
  }
  to {
    opacity:1;
    transform:translateY(0)
  }
}
.hero {
  display:grid;
  grid-template-columns:1.1fr 1fr;
  align-items:center;
  gap:70px;
  padding:68px 0 46px
}
.hero h1 {
  font-size:52px;
  letter-spacing:-2.6px;
  line-height:1.35;
  font-weight:600;
  margin:18px 0 22px
}
.hero h1 em {
  font-style:normal;
  color:var(--green);
  position:relative;
  white-space:nowrap
}
.hero-copy {
  color:var(--muted);
  font-size:15px;
  line-height:1.9;
  max-width:445px;
  margin-bottom:25px
}
.instrument-label {
  display:inline-flex;
  align-items:center;
  gap:7px;
  font-size:11px;
  border:1px solid var(--line);
  padding:5px 10px;
  border-radius:30px;
  color:var(--muted);
  margin-bottom:24px
}
.instrument-label:before {
  content:"";
  width:6px;
  height:6px;
  background:#6c8568;
  border-radius:50%
}
.button {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  min-height:48px;
  border-radius:10px;
  padding:12px 22px;
  font-weight:600;
  font-size:14px;
  transition:background .15s,transform .15s,box-shadow .15s;
  text-decoration:none;
  border:1px solid transparent
}
.button:hover {
  transform:translateY(-1px)
}
.button:active {
  transform:translateY(0)
}
.primary {
  background:var(--green);
  color:white;
  box-shadow:0 5px 12px #234f4314
}
.primary:hover {
  background:#193f34;
  box-shadow:0 7px 20px #234f4320
}
.secondary {
  background:var(--card);
  border-color:var(--line)
}
.secondary:hover {
  background:#eeeee7
}
.ghost {
  color:var(--muted)
}
.arrow {
  font-size:20px;
  font-weight:400;
  line-height:1
}
.actions {
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap
}
.hero-foot {
  font-size:11px;
  color:var(--muted);
  margin:14px 0 0
}
.atlas {
  position:relative;
  width:100%;
  aspect-ratio:1.05;
  max-width:440px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center
}
.atlas:before {
  content:"";
  position:absolute;
  inset:12%;
  border:1px dashed #c9cec4;
  border-radius:50%
}
.atlas:after {
  content:"";
  position:absolute;
  inset:2%;
  border:1px solid #d9ded4;
  border-radius:50%
}
.atlas-grid {
  position:relative;
  width:70%;
  height:72%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  transform:rotate(-9deg)
}
.petal {
  border-radius:60% 40% 30% 40%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden
}
.petal:before,.petal:after {
  content:"";
  position:absolute;
  inset:16px;
  border:1px solid #ffffff8c;
  border-radius:inherit
}
.petal:after {
  inset:32px
}
.petal:nth-child(1) {
  background:#ceddc5;
  border-radius:85% 35% 20% 35%
}
.petal:nth-child(2) {
  background:#d6c9e8;
  border-radius:35% 85% 35% 20%
}
.petal:nth-child(3) {
  background:#edcaac;
  border-radius:35% 20% 35% 85%
}
.petal:nth-child(4) {
  background:#c1d5dd;
  border-radius:20% 35% 85% 35%
}
.petal span {
  transform:rotate(9deg);
  font-family:Georgia,serif;
  font-size:33px;
  color:#3c493d;
  position:relative;
  z-index:1
}
.atlas-center {
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:64px;
  height:64px;
  display:grid;
  place-items:center;
  background:var(--card);
  border-radius:50%;
  font-size:28px;
  color:var(--green);
  box-shadow:0 2px 18px #27382c0c;
  z-index:2
}
.atlas-note {
  position:absolute;
  background:var(--paper);
  padding:2px 8px;
  font-size:11px;
  color:var(--muted);
  z-index:2;
  letter-spacing:1px
}
.atlas-note.top {
  top:0
}
.atlas-note.bottom {
  bottom:0
}
.atlas-star {
  position:absolute;
  right:8%;
  top:13%;
  font-size:25px;
  color:var(--purple);
  z-index:2
}
.stats-row {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:25px 0
}
.stat {
  display:flex;
  align-items:center;
  gap:15px;
  padding-left:30px;
  border-left:1px solid var(--line)
}
.stat:first-child {
  padding-left:0;
  border-left:0
}
.stat-value {
  font-family:Georgia,serif;
  font-size:31px;
  line-height:1;
  color:var(--green)
}
.stat-label {
  font-size:12px;
  line-height:1.6
}
.stat-label span {
  display:block;
  color:var(--muted);
  font-size:11px
}
.intro-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:55px;
  margin-top:37px
}
.section-kicker {
  font-size:11px;
  color:var(--muted);
  letter-spacing:1px;
  margin-bottom:15px
}
.principles {
  display:flex;
  flex-direction:column;
  gap:18px
}
.principle {
  display:flex;
  gap:14px
}
.principle-num {
  font-size:11px;
  font-family:monospace;
  color:var(--green);
  background:var(--green-soft);
  width:28px;
  height:28px;
  flex-shrink:0;
  border-radius:50%;
  display:grid;
  place-items:center
}
.principle strong {
  font-size:13px;
  display:block;
  font-weight:600
}
.principle p {
  font-size:12px;
  color:var(--muted);
  margin:4px 0 0;
  line-height:1.8
}
.boundary-note {
  background:#ebece3;
  padding:25px 28px;
  border-radius:16px
}
.boundary-note h3 {
  font-size:14px;
  margin-bottom:10px
}
.boundary-note p {
  color:var(--muted);
  font-size:12px;
  line-height:1.85;
  margin-bottom:12px
}
.boundary-note a {
  font-size:12px
}
.settings-line {
  display:flex;
  align-items:flex-start;
  gap:9px;
  font-size:12px;
  color:var(--muted);
  cursor:pointer
}
.settings-line input {
  accent-color:var(--green);
  width:16px;
  height:16px;
  flex-shrink:0;
  margin:3px 0 0
}
.hero-settings {
  margin-top:20px;
  max-width:460px
}
.resume-note {
  padding:12px 16px;
  background:var(--green-soft);
  border-radius:12px;
  font-size:12px;
  margin-bottom:16px
}
.steps {
  display:flex;
  align-items:center;
  gap:12px;
  justify-content:center;
  margin:34px 0 35px;
  color:#81887e;
  font-size:12px
}
.step {
  display:flex;
  align-items:center;
  gap:7px;
  white-space:nowrap
}
.step i {
  display:grid;
  place-items:center;
  font-style:normal;
  border:1px solid var(--line);
  width:21px;
  height:21px;
  border-radius:50%;
  font-size:10px
}
.step.active {
  color:var(--green);
  font-weight:600
}
.step.active i {
  background:var(--green);
  color:white;
  border-color:var(--green)
}
.step.done i {
  background:var(--green-soft);
  border-color:var(--green-soft);
  color:var(--green)
}
.step-line {
  width:50px;
  height:1px;
  background:var(--line)
}
.assessment-layout {
  max-width:880px;
  margin:auto
}
.assessment-top {
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  margin-bottom:12px
}
.assessment-top strong {
  font-size:14px;
  color:var(--green)
}
.progress {
  height:4px;
  border-radius:5px;
  background:#e0e5db;
  overflow:hidden
}
.progress span {
  display:block;
  height:100%;
  background:var(--green);
  border-radius:5px;
  transition:width .3s
}
.question-card {
  margin-top:22px;
  background:var(--card);
  border:1px solid #e1e4da;
  box-shadow:var(--shadow);
  border-radius:var(--radius);
  padding:28px 40px 34px;
  min-height:372px
}
.question-meta {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:27px
}
.question-number {
  font-family:Georgia,serif;
  color:var(--green);
  font-size:16px
}
.question-tools {
  display:flex;
  gap:16px
}
.question-tools button {
  font-size:11px;
  color:var(--muted);
  padding:6px 0
}
.question-tools button[aria-pressed=true] {
  color:var(--orange)
}
.question-title {
  font-size:19px;
  font-weight:500;
  text-align:center;
  margin-bottom:8px;
  letter-spacing:.2px
}
.question-help {
  font-size:12px;
  color:var(--muted);
  text-align:center;
  margin-bottom:32px
}
.poles {
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:24px;
  align-items:center;
  margin:0 0 25px
}
.pole {
  font-size:21px;
  line-height:1.6;
  font-weight:600
}
.pole.left {
  color:var(--green);
  text-align:left
}
.pole.right {
  color:#756090;
  text-align:right
}
.pole-en {
  display:block;
  font-size:12px;
  line-height:1.6;
  font-weight:400;
  margin-top:7px;
  color:var(--muted);
  letter-spacing:0
}
.versus {
  font-family:Georgia,serif;
  font-size:18px;
  font-style:italic;
  color:#949a91;
  font-weight:400
}
.scale-fieldset {
  border:0;
  padding:0;
  margin:0;
  min-width:0
}
.sr-only {
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap
}
.choices {
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px
}
.choice {
  position:relative;
  text-align:center;
  cursor:pointer;
  display:flex;
  align-items:center;
  flex-direction:column;
  gap:8px;
  border-radius:13px;
  border:1px solid #e2e5dc;
  padding:17px 5px 12px;
  background:#fbfcf7;
  transition:border-color .15s,background .15s,transform .15s
}
.choice:nth-child(n+4) {
  background:#fbf9fd
}
.choice:hover {
  border-color:#879b7e;
  transform:translateY(-2px)
}
.choice input {
  position:absolute;
  opacity:0;
  width:100%;
  height:100%;
  inset:0;
  margin:0;
  cursor:pointer
}
.choice:has(input:focus-visible) {
  outline:3px solid #7965ad;
  outline-offset:4px
}
.choice-circle {
  height:36px;
  width:36px;
  border-radius:50%;
  border:1.5px solid #97aa92;
  display:grid;
  place-items:center;
  color:#66815e;
  font-size:12px;
  transition:all .18s
}
.choice:nth-child(2) .choice-circle,.choice:nth-child(4) .choice-circle {
  height:30px;
  width:30px;
  margin:3px
}
.choice:nth-child(3) .choice-circle {
  height:24px;
  width:24px;
  margin:6px;
  border-color:#acb2a8;
  color:#798173
}
.choice:nth-child(n+4) .choice-circle {
  color:#89729f;
  border-color:#baa8cb
}
.choice-text {
  font-size:11px;
  color:var(--muted)
}
.choice:has(input:checked) {
  background:var(--green-soft);
  border-color:var(--green);
  transform:translateY(-2px)
}
.choice:has(input:checked) .choice-circle {
  background:var(--green);
  color:white;
  border-color:var(--green)
}
.choice:nth-child(n+4):has(input:checked) {
  background:var(--purple-soft);
  border-color:var(--purple)
}
.choice:nth-child(n+4):has(input:checked) .choice-circle {
  background:var(--purple);
  border-color:var(--purple)
}
.choice:nth-child(3):has(input:checked) {
  background:#eceee8;
  border-color:#747d6b
}
.choice:nth-child(3):has(input:checked) .choice-circle {
  background:#747d6b;
  border-color:#747d6b
}
.question-footnote {
  font-size:11px;
  color:var(--muted);
  margin:20px 0 0;
  text-align:center
}
.question-bottom {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:20px;
  gap:15px
}
.bottom-actions {
  display:flex;
  gap:10px;
  align-items:center
}
.question-bottom .button {
  min-width:106px
}
.keyboard-hint {
  text-align:center;
  color:#8b9186;
  font-size:11px;
  margin:23px 0 0
}
kbd {
  font-family:inherit;
  border:1px solid var(--line);
  border-radius:4px;
  padding:0 5px;
  background:var(--card);
  font-size:10px
}
.draft-line {
  font-size:11px;
  color:var(--muted);
  margin:10px 0 0
}
.palette-grid {
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:9px;
  margin:20px 0
}
.palette-grid button {
  border:1px solid var(--line);
  border-radius:9px;
  aspect-ratio:1;
  background:var(--card);
  font-size:13px;
  position:relative
}
.palette-grid button.answered {
  background:var(--green-soft);
  color:var(--green);
  border-color:#b8cdb4
}
.palette-grid button.flagged:after {
  content:"";
  width:6px;
  height:6px;
  position:absolute;
  right:5px;
  top:5px;
  background:var(--orange);
  border-radius:50%
}
.palette-grid button.current {
  outline:2px solid var(--green);
  outline-offset:2px
}
.review-header,.result-header {
  text-align:center;
  margin:0 auto 30px;
  max-width:650px
}
.review-header p,.result-header p {
  font-size:13px;
  color:var(--muted);
  line-height:1.9
}
.review-header h1 {
  font-size:34px;
  margin:10px 0 14px
}
.review-toolbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px
}
.filter-tabs {
  display:flex;
  background:#e9ece4;
  padding:4px;
  border-radius:10px;
  gap:3px
}
.filter-tabs button {
  font-size:12px;
  padding:7px 13px;
  border-radius:7px
}
.filter-tabs button.active {
  background:var(--card);
  box-shadow:0 2px 5px #223d2310
}
.review-count {
  font-size:11px;
  color:var(--muted)
}
.review-list {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}
.review-item {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  text-align:left;
  padding:14px 18px;
  display:flex;
  gap:14px;
  align-items:center;
  min-height:82px
}
.review-item:hover {
  border-color:#8caa88
}
.review-item-num {
  color:#7a8374;
  font-family:Georgia,serif;
  font-size:14px;
  flex-shrink:0;
  width:18px
}
.review-item-main {
  flex:1;
  min-width:0
}
.review-item-title {
  display:block;
  font-size:12px;
  line-height:1.6;
  word-break:break-word
}
.review-item-answer {
  display:block;
  font-size:11px;
  color:var(--green);
  margin-top:4px
}
.review-item.flagged .review-item-answer {
  color:var(--orange)
}
.review-sticky {
  position:sticky;
  bottom:0;
  background:#f5f3eef2;
  backdrop-filter:blur(12px);
  padding:18px 0 10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  border-top:1px solid var(--line);
  margin-top:25px
}
.review-sticky p {
  font-size:12px;
  color:var(--muted);
  margin:0

  });

    prev() { if (state.index > 0) openQuestion(state.index - 1, returnToReview); },
    next: nextQuestion,
    english() { patchState({ english: !state.english }); renderKeepingFocus('[data-action="english"]'); },
    flag() {
      const id = state.index + 1;
      const flagged = state.flags.includes(id);
      patchState({ flags: flagged ? state.flags.filter(n => n !== id) : [...state.flags, id] });
      renderKeepingFocus('[data-action="flag"]'); notice(flagged ? '已取消待复核标记。' : '已标记，最后可以集中复核。');
    },
    review() { if (dialog.open) dialog.close(); filter = 'all'; returnToReview = false; setView('review'); },
    firstMissing() { openQuestion(state.answers.indexOf(null), true); },
    finish() { if (count() < 32) return; checkpoint(); state.completedAt = new Date().toISOString(); setView('results'); },
    reset: confirmReset,
    cancelReset() { dialog.close(); },
    confirmReset() {
      try {
        const current = localStorage.getItem(STORAGE_KEY);
        if (current !== null && current !== storageSnapshot) { invalidatePersistence(); return; }
        localStorage.removeItem(STORAGE_KEY);
        if (localStorage.getItem(STORAGE_KEY) !== null) throw new Error('Draft was not removed');
      }
      catch (_) { storageError('浏览器未允许清除本地草稿，因此没有开始新的回答。请先清除此页面的站点数据，再换人使用，避免刷新后恢复上一位的回答。'); return; }
      storageSnapshot = null; storageSession = null; storageRevision = 0; persistenceInvalidated = false;
      persistenceNotice.hidden = true; persistenceNotice.textContent = '';
      cancelNext(); state = freshState(); activeStart = null; recovered = false; returnToReview = false; filter = 'all'; dialog.close(); dialogContent.innerHTML = ''; setView('welcome');
    }
  };
  const ACTION_WITH_CANCEL = new Set(['prev', 'next', 'english', 'flag', 'review']);
  document.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button || button.disabled) return;
    if (button.dataset.dialog) { openDialog(button.dataset.dialog); return; }
    if (button.dataset.question !== undefined) { if (dialog.open) dialog.close(); openQuestion(Number(button.dataset.question), button.dataset.fromReview === 'true'); return; }
    if (button.dataset.filter) { filter = button.dataset.filter; renderKeepingFocus(`[data-filter="${filter}"]`); return; }
    const action = button.dataset.action;
    if (!action) return;
    if (ACTION_WITH_CANCEL.has(action)) cancelNext();
    const handler = actionHandlers[action];
    if (handler) handler();
  });
  document.addEventListener('pointerdown', event => { pointerChoice = !!event.target.closest('.choice'); });
  document.addEventListener('change', event => {
    const target = event.target;
    if (target.name === 'answer') { updateSelection(Number(target.value), pointerChoice); pointerChoice = false; }
    else if (target.id === 'autoNext') { cancelNext(); patchState({ autoNext: target.checked }); }
    else if (target.id === 'remember' || target.id === 'rememberDialog') setRemember(target.checked);
  });
  document.addEventListener('input', event => { if (event.target.id === 'reflection') patchState({ notes: event.target.value.slice(0, 2000) }); });
  document.addEventListener('keydown', event => {
    pointerChoice = false;
    if (state.view !== 'question' || dialog.open || event.ctrlKey || event.metaKey || event.altKey || event.repeat) return;
    const target = event.target;
    if (target.tagName === 'TEXTAREA' || target.tagName === 'SELECT' || (target.tagName === 'INPUT' && target.type !== 'radio')) return;
    if (target.tagName === 'INPUT' && target.type === 'radio' && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(event.key)) return;
    if (/^[1-5]$/.test(event.key)) { event.preventDefault(); updateSelection(Number(event.key), true); }
    else if (event.key === 'Enter' && target.tagName !== 'BUTTON') { event.preventDefault(); nextQuestion(); }
    else if (event.key === 'ArrowRight' && target.tagName !== 'BUTTON') { event.preventDefault(); nextQuestion(); }
    else if (event.key === 'ArrowLeft' && target.tagName !== 'INPUT' && state.index > 0) { event.preventDefault(); openQuestion(state.index - 1, returnToReview); }
  });
  document.getElementById('homeButton').addEventListener('click', () => setView('welcome'));
  document.getElementById('closeDialog').addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', event => { if (event.target === dialog) { const rect = dialog.getBoundingClientRect(); if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close(); } });
  document.addEventListener('visibilitychange', () => { cancelNext(); checkpoint(); save(); });
  window.addEventListener('pagehide', () => { cancelNext(); save(); });
  window.addEventListener('storage', event => {
    if (!state.remember || (event.key !== STORAGE_KEY && event.key !== null)) return;
    try { if (localStorage.getItem(STORAGE_KEY) !== storageSnapshot) invalidatePersistence(true); }
    catch (_) { storageWorking = false; updateSaveStatus(); notice('无法核对本地草稿；当前页面暂时不能保存进度。'); }
  });
  window.addEventListener('beforeunload', event => { if (count() > 0 && (!state.remember || !storageWorking) && !state.completedAt) { event.preventDefault(); event.returnValue = ''; } });
  load(); render();
})();

</script>
</body>
</html>
